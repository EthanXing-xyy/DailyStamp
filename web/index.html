<style>
/* the loading screen (web/loader.js): inline, so it is the very first thing painted. Cream paper, the title up top and,
   standing at the foot of the screen, the door of a small post office: a bicycle with a basket of letters, the red door
   with its hanging sign, an old pillar box, a pot plant and a calico cat (scene/, drawn once by codex:
   dailystamp/scene.py). While the press works letters go into the box by themselves (a tap sends one, and the bell
   rings); the cat sits still. The sign shows how far the loading has got; when all is in it reads 营业中, the lamps come on
   inside (the door's glass glows) and a line at the foot says a tap goes in: anywhere on the screen, and the door swings
   open onto the lit post office inside, then onto the app. Everything moves softly and once: nothing bounces, nothing blinks. */
#loader { position: fixed; inset: 0; z-index: 1000; overflow: hidden; --ink: #2E2520; --paper: #EDE4D4; --door: #A5452F; --warm: #E9A95C;
  color: var(--ink); background: var(--paper);
  display: grid; justify-items: center; align-items: start; padding-top: 8vh; user-select: none; -webkit-user-select: none; cursor: progress;
  --row: min(46vw, 500px); --title: min(10vh, 8.5vw); }
@keyframes ld-fade { from { opacity: 0; } }
/* ---- the door of the post office, sized by loader.js to the room left under the type; everything in it is placed in %
   of the picture, so it only scales */
.ld-scene { position: absolute; left: 0; top: 0; opacity: 0; transition: opacity .8s ease; }
.ld-scene.on { opacity: 1; }
.ld-scene > * { position: absolute; }
/* the picture's paper has a grain the page hasn't: it fades out slowly towards the picture's (empty) edges */
.ld-cover { inset: 0; width: 100%; height: 100%; display: block; pointer-events: none;
  -webkit-mask-image: linear-gradient(90deg, transparent, rgba(0,0,0,.35) 4%, rgba(0,0,0,.8) 8%, #000 12%, #000 88%, rgba(0,0,0,.8) 92%, rgba(0,0,0,.35) 96%, transparent), linear-gradient(transparent, rgba(0,0,0,.35) 6%, rgba(0,0,0,.8) 12%, #000 18%, #000 82%, rgba(0,0,0,.8) 88%, rgba(0,0,0,.35) 94%, transparent);
  -webkit-mask-composite: source-in; mask-image: linear-gradient(90deg, transparent, rgba(0,0,0,.35) 4%, rgba(0,0,0,.8) 8%, #000 12%, #000 88%, rgba(0,0,0,.8) 92%, rgba(0,0,0,.35) 96%, transparent), linear-gradient(transparent, rgba(0,0,0,.35) 6%, rgba(0,0,0,.8) 12%, #000 18%, #000 82%, rgba(0,0,0,.8) 88%, rgba(0,0,0,.35) 94%, transparent);
  mask-composite: intersect; }
/* behind the door: the lit room it opens onto (scene/room.webp, set by loader.js; this warm light until it's in) */
.ld-room { background: #D9934E radial-gradient(120% 90% at 50% 100%, #F6CB86, #D9934E 70%, #B9743A) center / cover no-repeat; }
/* the door itself: a slab with some thickness, turning inward on hinges at its back, left edge. Its face is cut from
   the picture (scene/leaf.webp); as it opens, its hinge-side edge turns towards you. The thickness (--dt) and the
   eye's distance (--dp) follow the door's size (loader.js), so it turns alike on every screen */
/* (one picture turning read as a card turning, the user found: a door's look changes as it turns. So the light on it
   changes with it: its face fades to the same leaf drawn in the light it stands in when open, turned from the day,
   the room's lamp raking across it (scene/leaf-open.webp, .ld-relit); and its glass, holes in the face, goes clear:
   the room behind shows through it, moving against the door as it swings. All of it opacity, on the compositor) */
/* (at rest the same kind of transform as open, so every browser turns it on the compositor: function by function) */
/* (no preserve-3d: WebKit turned a 3D-nested slab the wrong way. The face and the edge are flat pieces, each carrying
   the whole placement, the same eye and the same hinge, so they turn as one) */
.ld-door { --a: 0deg; --dt: 4px; --dtn: -4px; --dp: 700px; --swing: 1.8s cubic-bezier(.45,0,.2,1); }
/* (the hinge is --dt behind the face, but the eye's distance is taken from the face: shut, the face is in the
   picture's plane and exactly the size it is painted. Taken from the hinge it stood 2% larger, over its own frame) */
.ld-door-face, .ld-door-edge { position: absolute; top: 0; height: 100%; transform-origin: 0 50%;
  transition: transform var(--swing); will-change: transform; background-repeat: no-repeat; }
.ld-door-face { left: 0; width: 100%; background-size: 100% 100%;
  transform: perspective(var(--dp)) translateZ(var(--dtn)) rotateY(var(--a)) translateZ(var(--dt)); }
.ld-door-face > * { position: absolute; background: no-repeat 0 0 / 100% 100%; will-change: opacity; transition: opacity var(--swing); }
.ld-relit { inset: 0; opacity: 0; }
.ld-film { opacity: 0; }
/* the hinge-side edge, standing square to the face at its left side: a strip of the door's paint, in the shade of
   the frame it turns out of */
.ld-door-edge { left: 0; width: var(--dt);
  transform: perspective(var(--dp)) translateZ(var(--dtn)) rotateY(var(--a)) translateZ(var(--dt)) rotateY(90deg);
  background-color: #8F4E37; }
#loader.opening .ld-door { --a: 72deg; }
/* the lamps inside come up as the loading gets on: the door's glass (scene/glass.webp, cut from the picture with its
   brush strokes) glows warm from within, and turns with the door; a soft halo round it, a little light on the paper
   at its foot. How lit is --lit (0..1), set by loader.js with --lit-t, a linear fade no quicker than a lamp warming
   up. (A lit line along the door's edge read as its frame glowing: the door is painted shut) */
.ld-door-face > .ld-lamp, .ld-door-face > .ld-ember {
  -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; transition: opacity var(--lit-t, 0s) linear; }
.ld-door-face > .ld-lamp { background: radial-gradient(ellipse 80% 90% at 50% 70%, #FDE4A6, #F2C171 45%, #D88D46); opacity: var(--lit, 0); }
/* under it, a dim lamp's deep amber, up well ahead of it: half lit, the dark glass and the lamp's yellow alone mixed to
   a dirty olive */
.ld-door-face > .ld-ember { background: radial-gradient(ellipse 80% 90% at 50% 70%, #A85A2A, #7C3C1E 55%, #52261A);
  opacity: min(.85, calc(var(--lit, 0) * 2.5)); }
.ld-bloom { border-radius: 50%; background: radial-gradient(closest-side, rgba(250,214,150,.42), rgba(250,214,150,0));
  opacity: var(--lit, 0); transition: opacity var(--lit-t, 0s) linear; pointer-events: none; }
/* the door open, the room's light falls out over the step and onto the ground */
.ld-spill { border-radius: 50%; background: radial-gradient(closest-side, rgba(246,196,120,.5), rgba(246,196,120,0)); opacity: 0;
  transition: opacity 1.8s ease; pointer-events: none; }
#loader.opening .ld-spill { opacity: 1; }
/* the bicycle's front wheel, which leans over the door's hinge side: it stays where it is as the door swings (under
   the glow on the ground, as the rest of the wheel in the picture is) */
.ld-wheel { background: no-repeat 0 0 / 100% 100%; pointer-events: none; }
.ld-glow { border-radius: 50%; background: radial-gradient(closest-side, rgba(233,169,92,.42), rgba(233,169,92,0));
  opacity: var(--lit, 0); transition: opacity var(--lit-t, 0s) linear; pointer-events: none; }
#loader.opening .ld-bloom { opacity: 0; transition: opacity 1.2s ease; }
/* the door swings: the light on it changes, its glass clears */
#loader.opening .ld-relit, #loader.opening .ld-film { opacity: 1; }
#loader.opening .ld-pane, #loader.opening .ld-ember { opacity: 0; transition: opacity var(--swing); }
#loader.opening .ld-lamp { opacity: .16; transition: opacity var(--swing); }
/* the hanging sign: how far along, then 营业中, laid onto the board by loader.js */
.ld-sign { left: 0; top: 0; transform-origin: 0 0; display: grid; place-items: center; color: #3A2C24; mix-blend-mode: multiply; pointer-events: none; }
.ld-sign > * { grid-area: 1 / 1; white-space: nowrap; transition: opacity .6s ease; }
.ld-pct { font-family: "DS LoadCaps", sans-serif; letter-spacing: .06em; padding-left: .06em; font-variant-numeric: tabular-nums; opacity: .8; }
.ld-open { font-family: "DS LoadPhrase", serif; letter-spacing: .18em; padding-left: .18em; opacity: 0; }
#loader.ready .ld-pct { opacity: 0; }
#loader.ready .ld-open { opacity: .85; }
/* the cat: one pose, sitting still */
.ld-cat { pointer-events: none; }
.ld-cat img { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); }
/* a letter on its way to the box, and the bell's ring */
/* (the letter flies inside a still frame whose foot is the slot line, so going down it vanishes there: nothing clipped
   frame by frame, which left a page open all night slowly growing) */
.ld-mail { overflow: hidden; pointer-events: none; }
.ld-letter { position: absolute; pointer-events: none; opacity: 0; will-change: transform; }
.ld-ring { border: 1.5px solid var(--ink); border-color: transparent var(--ink) transparent transparent; border-radius: 50%; opacity: 0; pointer-events: none; }
/* what can be tapped: a little more than the thing itself, and nothing drawn */
/* (the studio's global button:hover would paint them dark: a tap leaves a phone "hovering") */
.ld-hit, .ld-hit:hover, .ld-hit:active { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.ld-hit:focus-visible { outline: 0; }
.ld-hit-door { cursor: default; }
#loader.ready .ld-hit-door { cursor: pointer; }
/* ---- the type, above the door */
/* one track exactly as wide as the row, so a long line can't widen it and push the column off centre */
.ld-main { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; width: var(--row); }
/* letter-spaced lines carry the same amount as padding-left, so the type itself sits on the centre line */
.ld-title { position: relative; margin: 0; font-family: "DS LoadPhrase", serif; font-weight: normal; line-height: 1;
  font-size: var(--title); letter-spacing: .16em; padding-left: .16em; white-space: nowrap; }
.ld-sub { margin: calc(var(--title) * .26) 0 0; font-family: "DS LoadCaps", sans-serif; font-size: max(10px, min(1.6vh, 12px));
  letter-spacing: .28em; padding-left: .28em; white-space: nowrap; opacity: .72; }
/* under the date: what the press is doing on the left, how far on the right; the way in takes the same spot */
.ld-foot { display: grid; width: 100%; margin-top: min(3.6vh, 28px); }
.ld-foot > * { grid-area: 1 / 1; }
.ld-row { align-self: start; display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  transition: opacity .3s ease; }
.ld-say { margin: 0; font-family: "DS LoadPhrase", serif; font-size: max(13px, min(1.9vh, 15px)); letter-spacing: .2em; }
.ld-say span { font-family: "DS LoadCaps", sans-serif; font-size: .86em; letter-spacing: .1em; margin-left: .7em; opacity: .62; }
.ld-count { font-family: "DS LoadCaps", sans-serif; font-size: max(11px, min(1.7vh, 13px)); letter-spacing: .12em; margin-right: -.12em;
  font-variant-numeric: tabular-nums; opacity: .72; }
/* all in and the last stroke down: a postmark strikes the title once, then the way in fades up where the status line was */
.ld-mark { position: absolute; left: calc(50% + var(--title) * 1.72); top: calc(var(--title) * -.5); width: max(80px, calc(var(--title) * 1.02));
  aspect-ratio: 1; display: grid; place-content: center; justify-items: center; gap: 3px; border: 1.5px solid currentColor; border-radius: 50%;
  transform: rotate(-12deg); opacity: 0; pointer-events: none; color: var(--door); }
.ld-mark::before { content: ""; position: absolute; inset: 4px; border: 1px solid currentColor; border-radius: 50%; }
.ld-mark span { font-family: "DS LoadPhrase", serif; font-size: max(10px, calc(var(--title) * .12)); letter-spacing: .24em; padding-left: .24em; }
.ld-mark b { font-family: "DS LoadCaps", sans-serif; font-weight: normal; font-size: max(16px, calc(var(--title) * .22)); line-height: 1;
  letter-spacing: .06em; padding: 3px 0 2px .06em; border-top: 1px solid; border-bottom: 1px solid; }
/* the way in: one line at the foot of the screen in the subtitle's own type, like a title screen; the whole screen
   takes the tap (but for the toys in the picture: loader.js). No box, no arrow: the lit windows say it's open */
.ld-go { position: absolute; left: 0; right: 0; bottom: max(5.5vh, 24px); width: max-content; margin: 0 auto; padding: 10px 14px 10px calc(14px + .28em);
  background: none; border: 0; color: inherit; cursor: pointer; visibility: hidden; opacity: 0; white-space: nowrap;
  font-family: "DS LoadCaps", sans-serif; font-size: max(10px, min(1.6vh, 12px)); letter-spacing: .28em;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.ld-go b { font-family: "DS LoadPhrase", serif; font-weight: normal; letter-spacing: .3em; }
.ld-go:focus-visible { outline: 0; }
#loader .ld-go:hover, #loader .ld-go:active { background: none; }
#loader.ready { cursor: pointer; }
#loader.ready .ld-row { opacity: 0; }
#loader.ready .ld-mark { opacity: .9; animation: ld-mark .2s .3s cubic-bezier(.2,.7,.2,1) both; }
@keyframes ld-mark { from { opacity: 0; transform: rotate(-12deg) scale(1.07); } }
#loader.ready .ld-go { visibility: visible; opacity: .72; animation: ld-go-in 1s 1.4s ease both; }
@keyframes ld-go-in { from { opacity: 0; } }
/* phone is portrait-only for now: the turn-sideways card is parked (see loader.js)
#rotate { position: fixed; inset: 0; z-index: 1001; display: none; place-items: center; color: var(--ld-ink, #1B1633);
  background: radial-gradient(circle, var(--ld-dot, #E23C84) 26%, transparent 28%) 0 0 / 16px 16px, var(--ld-bg, #FF5FA2); }
#rotate.on { display: grid; animation: ld-fade .4s ease both; }
.rt-card { display: grid; justify-items: center; gap: 10px; padding: 34px 26px 22px; background: #F3EEE3; border: 3px solid var(--ld-ink);
  box-shadow: 8px 8px 0 var(--ld-ink); border-radius: 6px; width: min(78vw, 320px); text-align: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.rt-phone { width: 54px; height: 92px; border: 4px solid var(--ld-ink); border-radius: 12px; background: var(--ld-bar, #FFD400); position: relative;
  margin-bottom: 14px; animation: rt-turn 2.6s cubic-bezier(.6,0,.3,1) infinite; }
.rt-phone i { position: absolute; left: 50%; bottom: 6px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--ld-ink); }
@keyframes rt-turn { 0%, 25% { transform: rotate(0); } 55%, 90% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
.rt-head { margin: 0; font-family: "DS LoadPhrase", serif; font-size: 28px; letter-spacing: .1em; }
.rt-en { margin: 0; font-family: "DS LoadCaps", sans-serif; font-size: 11px; letter-spacing: .36em; }
.rt-say { margin: 8px 0 0; font-family: "DS LoadPhrase", serif; font-size: 14px; letter-spacing: .08em; opacity: .8; text-wrap: balance; }
.rt-portrait { margin-top: 6px; background: none; border: 0; padding: 8px; color: inherit; font-family: "DS LoadPhrase", serif; font-size: 13px;
  letter-spacing: .12em; text-decoration: underline; text-underline-offset: 4px; opacity: .7; cursor: pointer; }
*/
@media (prefers-reduced-motion: reduce) {
  #loader.ready .ld-mark, #loader.ready .ld-go { animation: ld-fade .4s ease both; }
  .ld-door { transition: opacity .4s ease; }
  #loader.opening .ld-door { --a: 0deg; opacity: 0; }
}
/* upright screens (a phone): a column as wide as the screen allows */
@media (max-aspect-ratio: 1/1) {
  #loader { --row: min(calc(100vw - 72px), 400px); --title: min(14vw, 10vh); padding-top: 9vh; }
  .ld-mark { left: auto; right: calc(var(--title) * -.08); top: calc(var(--title) * -.9); }
}
</style>

<section id="home" aria-label="每日一枚 · 首页"></section>
<!-- the home's type printed on kraft: its edges roughened a little (home.css), finer for the small type -->
<svg class="home-roughs" width="0" height="0" aria-hidden="true" focusable="false">
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="rough-s" x="-5%" y="-20%" width="110%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="0.6" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>
<aside id="panel">
  <a class="to-home" href="#">← 首页</a>
  <h1>每日一枚<small>DAILY STAMP · STUDIO</small></h1>

  <section>

<main id="stage">
  <a class="to-home" id="stage-home" href="#">← 首页</a>
  <div id="opening-head">
    <span>DAILY STAMP · ONE FOR TODAY</span>
    <h2>每日一枚</h2>
